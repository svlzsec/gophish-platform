[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gophish-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "PyYAML>=6,<7", "boto3>=1.34,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "respx>=0.21,<1"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["tests", "../scripts/tests"]
