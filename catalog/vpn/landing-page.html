<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SecureConnect</title><style>*{box-sizing:border-box}body{margin:0;background:#0d263a;font:15px Arial;color:#172b3a;min-height:100vh;display:grid;place-items:center}.card{width:min(470px,calc(100% - 32px));background:#fff;border-radius:8px;padding:38px}.brand{color:#126782;font-size:22px;font-weight:bold}h1{font-size:25px}label{display:block;margin:22px 0 8px}input{width:100%;padding:12px;border:1px solid #9aa9b4;border-radius:4px;background:#f6f8fa}button{width:100%;margin-top:22px;background:#168aad;color:#fff;border:0;border-radius:4px;padding:12px;font-weight:bold}.notice{font-size:11px;color:#657783;margin-top:22px;text-align:center}</style></head><body><main class="card"><div class="brand">◈ SecureConnect</div><h1>Revisión de acceso remoto</h1><p>Confirma que esta es la cuenta asignada a tu acceso remoto.</p><form method="post" action=""><label for="email">Cuenta corporativa</label><input id="email" name="email" type="email" value="{{.Email}}" readonly><button type="submit">Confirmar cuenta</button></form><div class="notice">Simulación autorizada. Nunca introduzcas tu contraseña en enlaces recibidos por correo.</div></main></body></html>
