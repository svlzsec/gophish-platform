<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal de productividad</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;color:#252525;background:linear-gradient(135deg,#eef5fb,#f8f3f7);min-height:100vh;display:grid;place-items:center}.card{width:min(440px,calc(100% - 32px));background:#fff;padding:42px;box-shadow:0 4px 20px #0002}.brand{font-size:20px;font-weight:700;color:#555}.mark{display:inline-grid;grid-template-columns:8px 8px;gap:2px;margin-right:8px}.mark i{width:8px;height:8px;background:#2775c9}.mark i:nth-child(2){background:#44a845}.mark i:nth-child(3){background:#f2b01e}.mark i:nth-child(4){background:#dc4b38}h1{font-size:24px;margin:22px 0}label{display:block;color:#666;margin-bottom:8px}input{width:100%;border:0;border-bottom:1px solid #555;padding:10px 2px;font-size:16px}.actions{text-align:right;margin-top:28px}button{border:0;background:#1769aa;color:#fff;padding:10px 28px;font-weight:600}.notice{margin-top:28px;padding-top:16px;border-top:1px solid #eee;font-size:11px;color:#777}
  </style>
</head>
<body><main class="card"><div class="brand"><span class="mark"><i></i><i></i><i></i><i></i></span>Portal de productividad</div><h1>Confirmar cuenta</h1><form method="post" action=""><label for="email">Correo corporativo</label><input id="email" name="email" type="email" value="{{.Email}}" autocomplete="email" required><div class="actions"><button type="submit">Siguiente</button></div></form><div class="notice">Simulación interna autorizada. Esta página no solicita ni almacena contraseñas.</div></main></body>
</html>
