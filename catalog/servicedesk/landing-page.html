<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Desk</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f5;font:15px Arial;color:#25313c}.nav{background:#254b6e;color:#fff;padding:20px 7%;font-size:21px}.ticket{max-width:800px;margin:45px auto;background:#fff;border:1px solid #d4dce3}.head{padding:26px;border-bottom:1px solid #e3e7ea}.body{padding:26px}.status{display:inline-block;background:#e8f4ec;color:#257044;padding:5px 10px;border-radius:12px;font-size:12px}button{background:#2673b8;border:0;color:#fff;padding:11px 18px}.notice{margin-top:25px;border-left:4px solid #e2a93b;background:#fff8e8;padding:13px;font-size:12px}@media(max-width:840px){.ticket{margin:18px}}</style></head><body><header class="nav">Service Desk</header><main class="ticket"><section class="head"><span class="status">Esperando confirmación</span><h1>Solicitud de soporte</h1></section><section class="body"><p>La nota está disponible para la cuenta <strong>{{.Email}}</strong>.</p><form method="post" action=""><input type="hidden" name="email" value="{{.Email}}"><button type="submit">Confirmar visualización</button></form><div class="notice">Ejercicio autorizado: verifica siempre el dominio antes de abrir enlaces de soporte.</div></section></main></body></html>
